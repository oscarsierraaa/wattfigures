        { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://{{DOMAIN}}/" },
        { "@type": "ListItem", "position": 2, "name": "{{PAGE_TITLE}}", "item": "{{CANONICAL}}" }
      ] }
    ]
  }

      <p style="color:hsl(var(--muted-foreground))">{{T_LASTUPD}}: {{DATE_MODIFIED}}</p>
